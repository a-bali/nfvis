# Default configuration. Settings may be omitted to use these defaults.
listen:
  udp: "0.0.0.0:2055"
  http: "127.0.0.1:8080"

database:
  path: "data/nfvis.db"
  batch_size: 1000
  flush_interval: 250ms
  # Startup schema-migration budget. Indexing a multi-GB flows table takes
  # minutes, and exceeding this rolls the migration back and exits before the
  # service serves. Default 30m; raise it for a very large existing database.
  migration_timeout: 30m
  # SQLite memory. These two values, not the data volume, decide what a container
  # runtime reports as this process's memory: mmap'd database pages are charged as
  # file-backed memory, and the page cache is unreclaimable heap.
  #
  # BOTH ARE PER CONNECTION, and the pool holds eight. A 128 MiB cache_size is
  # therefore up to ~1 GiB of anonymous memory; eight concurrent readers measured
  # 1933 MB RssAnon at 128 and 257 MB at 16. That multiplication is why the
  # defaults look modest while the process reports a gigabyte.
  #
  # Measured on a 1.2 GB database at production row width, 1024/128 kept 1156 MiB
  # resident where 256/16 kept 285 MiB, costing 11-21% on full-table scans.
  # Dashboard queries read index pages rather than whole tables, so the smaller
  # map is usually the better trade; verify with /api/v1/timeseries latency.
  mmap_size_mb: 1024       # per connection; 0 disables mmap; max 2047
  cache_size_mb: 128       # per connection, 1-4096; SQLite's own page cache (0 is rejected)
  # Duplicate suppression. Both mechanisms are inert until you declare the
  # topology they exploit: a matching payload alone is not evidence that two
  # records describe the same packet, so with nothing configured every record is
  # stored. See docs/operations.md before enabling either.
  dedup:
    # Collapse the per-interface copies of one frame. Requires
    # parent_child_links: the exporter and the interface pairs that may
    # collapse. The parent record survives.
    parent_child: false
    parent_child_links: []
    #   - exporter: "192.168.1.1"
    #     parent: 2
    #     child: 7
    # Drop the post-NAT copy of a forwarded packet when its pre-NAT mate is
    # seen. Requires wan_addresses (the firewall's own NAT-boundary addresses)
    # and an exporters entry naming the input interface of each view.
    nat:
      wan_addresses: []
      exporters: []
      # - address: "192.168.1.1"
      #   pre_interface: 2
      #   post_interface: 7
      window: 2s
  retention:
    raw: 720h              # 30 days
    hourly: 8760h          # 1 year
    cleanup_interval: 1h
    cleanup_batch: 5000
  # The hourly tier is implicit and uses retention.hourly.
  resolution:
    - bucket: 1m
      retention: 168h
    - bucket: 5m
      retention: 720h

decoder:
  workers: 4
  queue_size: 4096
  template_ttl: 30m
  max_packet_bytes: 65535
  max_flows_per_packet: 10000

dns:
  enabled: true
  cache_ttl: 5m
  cache_size: 10000
  lookup_timeout: 2s
  # Resolver for PTR lookups: an IP with an optional port. Default port is 53.
  # Empty uses the system resolver from /etc/resolv.conf.
  server: ""

# Optional exporter interface labels, CIDR-to-VLAN rules and VLAN names.
# Configure these for your own network; exported VLAN tags take precedence.
exporters: []
vlan_rules: []
vlan_labels: {}

logging:
  level: info
