# Default configuration. Settings may be omitted to use these defaults.
listen:
  udp: "0.0.0.0:2055"
  http: "127.0.0.1:8080"

database:
  path: "data/nfvis.db"
  batch_size: 1000
  flush_interval: 250ms
  # Duplicate suppression. ng_netflow on OPNsense exports one record per
  # interface node, so a tagged frame appears once for the parent interface and
  # once for its VLAN child; both are stored unless parent_child is on.
  dedup:
    parent_child: true
    # The pre-NAT and post-NAT view of one forwarded packet are both exported.
    # Set wan_addresses to the firewall's own address(es) on the NAT boundary so
    # the post-NAT copy is dropped when its pre-NAT mate is seen. Leave it empty
    # to keep both copies: without the address there is no way to tell a
    # post-NAT copy from the firewall's own WAN-sourced traffic.
    nat:
      wan_addresses: []
      window: 2s
  retention:
    raw: 720h              # 30 days
    hourly: 8760h          # 1 year
    cleanup_interval: 1h
    cleanup_batch: 5000
  # The hourly tier is implicit and uses retention.hourly.
  resolution:
    - bucket: 1m
      retention: 168h
    - bucket: 5m
      retention: 720h

decoder:
  workers: 4
  queue_size: 4096
  template_ttl: 30m
  max_packet_bytes: 65535
  max_flows_per_packet: 10000

dns:
  enabled: true
  cache_ttl: 5m
  cache_size: 10000
  lookup_timeout: 2s
  # Resolver for PTR lookups: an IP with an optional port. Default port is 53.
  # Empty uses the system resolver from /etc/resolv.conf.
  server: ""

# Optional exporter interface labels, CIDR-to-VLAN rules and VLAN names.
# Configure these for your own network; exported VLAN tags take precedence.
exporters: []
vlan_rules: []
vlan_labels: {}

logging:
  level: info
